<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Heartbeat Concept A — Pulse Node</title>
  <desc id="desc">A deep navy presentation board showing a blue and cyan pulse path that suggests an H through connected service nodes, paired with the Heartbeat wordmark.</desc>

  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a31"/>
      <stop offset="1" stop-color="#0c2b4a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.48" stop-color="#2789f4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2789f4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2789f4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9bdcff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <!-- Presentation board: this file is a visual concept sheet, not production lockup artwork. -->
  <rect width="1200" height="760" rx="34" fill="#04101f"/>
  <rect x="18" y="18" width="1164" height="724" rx="26" fill="url(#board)" stroke="#2d5c83" stroke-opacity="0.55"/>
  <rect x="18" y="18" width="1164" height="724" rx="26" fill="url(#grid)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="82" y="94" fill="#7dd3fc" font-size="14" letter-spacing="3.4" font-weight="700">HEARTBEAT / BRAND EXPLORATION</text>
    <text x="1118" y="94" text-anchor="end" fill="#9db9d2" font-size="13" letter-spacing="1.4">CONCEPT A · PULSE NODE</text>
    <path d="M82 122H1118" stroke="#7dd3fc" stroke-opacity="0.18"/>

    <circle cx="352" cy="369" r="244" fill="url(#halo)"/>
    <circle cx="352" cy="369" r="171" fill="#06182e" stroke="#3f7aa5" stroke-opacity="0.54"/>

    <!-- The H-shaped pulse: two service rails joined by one measured signal path. -->
    <g transform="translate(252 267)">
      <path d="M0 0V204 M200 0V204" stroke="#7dd3fc" stroke-opacity="0.32" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 0V204 M200 0V204" stroke="#2789f4" stroke-opacity="0.88" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 102H49L72 64L98 142L124 102H200" fill="none" stroke="#06182e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 102H49L72 64L98 142L124 102H200" fill="none" stroke="url(#pulse)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
      <g fill="#06182e" stroke="#7dd3fc" stroke-width="5">
        <circle cx="0" cy="0" r="12"/>
        <circle cx="0" cy="204" r="12"/>
        <circle cx="200" cy="0" r="12"/>
        <circle cx="200" cy="204" r="12"/>
      </g>
      <circle cx="72" cy="64" r="7" fill="#7dd3fc"/>
      <circle cx="98" cy="142" r="7" fill="#2789f4"/>
      <circle cx="124" cy="102" r="7" fill="#7dd3fc"/>
    </g>

    <text x="570" y="337" fill="#eff8ff" font-size="74" font-weight="700" letter-spacing="-2.2">Heartbeat</text>
    <text x="574" y="382" fill="#7dd3fc" font-size="19" letter-spacing="0.4">Local Dev Service Control</text>
    <path d="M574 418H1018" stroke="#7dd3fc" stroke-opacity="0.25"/>
    <text x="574" y="460" fill="#b9d1e4" font-size="18">Real-time orchestration, made visible.</text>
    <text x="574" y="493" fill="#7898b2" font-size="15">A pulse traverses connected nodes to imply active services</text>
    <text x="574" y="518" fill="#7898b2" font-size="15">without borrowing medical or status-color conventions.</text>

    <g transform="translate(82 641)">
      <rect width="1036" height="58" rx="14" fill="#06182e" fill-opacity="0.72" stroke="#3f7aa5" stroke-opacity="0.38"/>
      <circle cx="34" cy="29" r="10" fill="#2789f4"/>
      <text x="58" y="35" fill="#bdd8eb" font-size="14" letter-spacing="0.2">Signal-led mark</text>
      <circle cx="247" cy="29" r="10" fill="#7dd3fc"/>
      <text x="271" y="35" fill="#bdd8eb" font-size="14" letter-spacing="0.2">Connected service nodes</text>
      <text x="1000" y="35" text-anchor="end" fill="#6e91ad" font-size="13" letter-spacing="1.2">DRAFT / FOR SELECTION</text>
    </g>
  </g>
</svg>
