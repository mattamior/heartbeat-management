<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Heartbeat Concept G — Pulse Brackets, QRS refinement</title>
  <desc id="desc">A dark presentation board showing two symmetrical square service brackets bridged by a restrained, rounded QRS-style heartbeat pulse, with the Heartbeat wordmark and size checks.</desc>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2a"/>
      <stop offset="1" stop-color="#0b2a40"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2789f4"/>
      <stop offset="0.52" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2789f4"/>
    </linearGradient>
    <radialGradient id="markHalo" cx="50%" cy="50%" r="52%">
      <stop offset="0" stop-color="#2789f4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2789f4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9bdcff" stroke-opacity=".045"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- The mark keeps the brackets geometric and uses a compact rounded QRS rhythm: baseline, soft dip, narrow peak, recovery, then baseline. -->
    <g id="pulse-brackets" fill="none" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M94 48H42V232H94" stroke="currentColor" stroke-width="18"/>
      <path d="M206 48H258V232H206" stroke="currentColor" stroke-width="18"/>
      <path d="M94 140H114L126 132L134 143L145 104L156 174L168 140H206" stroke="url(#signal)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="94" cy="140" r="8" fill="currentColor" stroke="none"/>
      <circle cx="206" cy="140" r="8" fill="currentColor" stroke="none"/>
    </g>
    <g id="pulse-brackets-flat" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M94 48H42V232H94 M206 48H258V232H206 M94 140H114L126 132L134 143L145 104L156 174L168 140H206" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="94" cy="140" r="8" fill="currentColor" stroke="none"/>
      <circle cx="206" cy="140" r="8" fill="currentColor" stroke="none"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#04101b"/>
  <rect x="24" y="24" width="1552" height="852" rx="26" fill="url(#board)" stroke="#2a5971" stroke-width="2"/>
  <rect x="24" y="24" width="1552" height="852" rx="26" fill="url(#grid)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="84" y="91" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="4.4">CONCEPT G / PULSE BRACKETS</text>
    <text x="84" y="126" fill="#7897aa" font-size="16" letter-spacing="1.4">A CONTROLLED PULSE BETWEEN TWO SERVICE BOUNDARIES</text>
    <path d="M84 154H1516" stroke="#7dd3fc" stroke-opacity=".18"/>

    <g transform="translate(112 210)">
      <rect width="590" height="500" rx="22" fill="#081b2a" stroke="#315e77" stroke-width="2"/>
      <circle cx="295" cy="236" r="225" fill="url(#markHalo)"/>
      <g transform="translate(153 126) scale(1.05)" color="#e4f7ff">
        <use href="#pulse-brackets"/>
      </g>
      <path d="M64 408H526" stroke="#214960" stroke-width="2"/>
      <text x="295" y="451" text-anchor="middle" fill="#82a5b8" font-size="14" letter-spacing="3">BOUNDARY · SIGNAL · CONTROL</text>
    </g>

    <g transform="translate(820 222)">
      <g transform="translate(0 2) scale(.29)" color="#7dd3fc"><use href="#pulse-brackets"/></g>
      <text x="122" y="67" fill="#eff9ff" font-size="54" font-weight="700" letter-spacing="-1.4">Heart<tspan fill="#7dd3fc">beat</tspan></text>
      <text x="125" y="108" fill="#8bb0c4" font-size="16" letter-spacing="2.4">LOCAL DEV SERVICE CONTROL</text>
      <path d="M0 146H658" stroke="#4b7890" stroke-opacity=".55" stroke-width="2"/>
      <text x="0" y="196" fill="#b9d4e4" font-size="21">A quiet signal that keeps services inside the line.</text>
      <text x="0" y="237" fill="#7898ad" font-size="16">Brackets frame the managed surface; the pulse marks the active handoff.</text>
      <text x="0" y="266" fill="#7898ad" font-size="16">One restrained bridge, two endpoints, no status-color dependency.</text>
    </g>

    <g transform="translate(820 555)">
      <text x="0" y="0" fill="#7dd3fc" font-size="15" font-weight="700" letter-spacing="3.2">SIZE CHECKS</text>
      <g transform="translate(0 31)" color="#dff6ff">
        <g transform="translate(0 0) scale(.069)"><use href="#pulse-brackets-flat"/></g>
        <g transform="translate(116 0) scale(.104)"><use href="#pulse-brackets-flat"/></g>
        <g transform="translate(263 0) scale(.138)"><use href="#pulse-brackets-flat"/></g>
        <text x="18" y="266" text-anchor="middle" fill="#90adbe" font-size="14">16 px</text>
        <text x="147" y="266" text-anchor="middle" fill="#90adbe" font-size="14">24 px</text>
        <text x="304" y="266" text-anchor="middle" fill="#90adbe" font-size="14">32 px</text>
      </g>

      <g transform="translate(426 0)">
        <text x="0" y="0" fill="#7dd3fc" font-size="15" font-weight="700" letter-spacing="3.2">MONO / REVERSE</text>
        <rect x="0" y="31" width="118" height="118" rx="18" fill="#f1fbff"/>
        <g transform="translate(7 41) scale(.35)" color="#0b2030"><use href="#pulse-brackets-flat"/></g>
        <rect x="142" y="31" width="118" height="118" rx="18" fill="#14364d"/>
        <g transform="translate(149 41) scale(.35)" color="#f1fbff"><use href="#pulse-brackets-flat"/></g>
        <text x="59" y="178" text-anchor="middle" fill="#90adbe" font-size="13">positive</text>
        <text x="201" y="178" text-anchor="middle" fill="#90adbe" font-size="13">reverse</text>
      </g>
    </g>

    <text x="84" y="831" fill="#37647a" font-size="14" letter-spacing="2.8">VECTOR EXPLORATION · SERVICE BOUNDARIES / ACTIVE HANDOFF</text>
    <text x="1516" y="831" text-anchor="end" fill="#37647a" font-size="14" letter-spacing="2.8">HEARTBEAT / 2026</text>
  </g>
</svg>
