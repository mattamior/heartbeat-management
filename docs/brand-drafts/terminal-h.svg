<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Heartbeat Concept B — Terminal H</title>
  <desc id="desc">A deep navy presentation board showing a geometric H made from a terminal cursor and a short blue pulse, paired with the Heartbeat wordmark.</desc>

  <defs>
    <linearGradient id="pulse-gradient" x1="124" y1="184" x2="294" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2789f4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="panel-gradient" x1="480" y1="70" x2="480" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102845"/>
      <stop offset="1" stop-color="#0b1c32"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Presentation board: intentionally part of this draft preview, not the production mark. -->
  <rect width="960" height="520" fill="#071426"/>
  <rect x="20" y="20" width="920" height="480" rx="28" fill="#0a1b31" stroke="#183757" stroke-width="2"/>

  <g aria-label="Concept label">
    <text x="64" y="67" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">CONCEPT B · TERMINAL H</text>
    <text x="896" y="67" text-anchor="end" fill="#6b91b7" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.4">BRAND STUDY / 2026</text>
  </g>

  <!-- Terminal preview panel. -->
  <rect x="64" y="92" width="832" height="252" rx="22" fill="url(#panel-gradient)" stroke="#21496d" stroke-width="2"/>
  <path d="M64 138H896" stroke="#21496d" stroke-width="2"/>
  <g fill="#2789f4">
    <circle cx="94" cy="115" r="5"/>
    <circle cx="112" cy="115" r="5" fill="#7dd3fc"/>
    <circle cx="130" cy="115" r="5" fill="#3d6e9a"/>
  </g>
  <text x="166" y="120" fill="#6b91b7" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.2">HEARTBEAT // SERVICE CONTROL</text>

  <!-- Terminal H mark: cursor bracket + pulse bridge form a geometric H. -->
  <g aria-label="Terminal H mark" transform="translate(118 148)">
    <path d="M10 8H30L53 31L30 54H10" fill="none" stroke="#2789f4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84 8V68M194 8V68" fill="none" stroke="#2789f4" stroke-width="9" stroke-linecap="round"/>
    <path d="M84 38H104L113 19L125 57L137 38H194" fill="none" stroke="url(#pulse-gradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)"/>
    <rect x="214" y="25" width="12" height="28" rx="2" fill="#7dd3fc"/>
    <circle cx="84" cy="38" r="4.5" fill="#7dd3fc"/>
    <circle cx="194" cy="38" r="4.5" fill="#7dd3fc"/>
  </g>

  <g aria-label="Heartbeat wordmark">
    <text x="390" y="205" fill="#f2f8ff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.8">Heartbeat</text>
    <text x="394" y="238" fill="#8fb6da" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="0.4">本地开发服务控制台 · Local Dev Service Control</text>
    <path d="M394 266H696" stroke="#2789f4" stroke-width="2" stroke-linecap="round"/>
    <text x="394" y="291" fill="#5f86ad" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.3">CONNECT · OBSERVE · KEEP MOVING</text>
  </g>

  <!-- Small usage preview keeps the concept legible at a compact size. -->
  <g transform="translate(64 386)">
    <rect width="832" height="82" rx="16" fill="#0e2743" stroke="#183757"/>
    <text x="24" y="31" fill="#6b91b7" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">MARK ONLY</text>
    <g transform="translate(144 18) scale(0.66)">
      <path d="M10 8H30L53 31L30 54H10" fill="none" stroke="#2789f4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M84 8V68M194 8V68" fill="none" stroke="#2789f4" stroke-width="9" stroke-linecap="round"/>
      <path d="M84 38H104L113 19L125 57L137 38H194" fill="none" stroke="url(#pulse-gradient)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="214" y="25" width="12" height="28" rx="2" fill="#7dd3fc"/>
    </g>
    <text x="392" y="36" fill="#d6e8f8" font-family="Arial, Helvetica, sans-serif" font-size="14">Compact mark for favicon, sidebar, and service tiles</text>
    <text x="392" y="58" fill="#6b91b7" font-family="Arial, Helvetica, sans-serif" font-size="12">Blue-only identity keeps runtime status colors separate.</text>
  </g>
</svg>
