<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Concept B / Terminal H — Heartbeat logo presentation</title>
  <desc id="desc">A deep navy presentation board for the Heartbeat developer service control logo. A large Terminal H mark appears on the left, with wordmark, size checks, and mono and reverse examples on the right.</desc>

  <defs>
    <linearGradient id="pulse-gradient" x1="84" y1="38" x2="194" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2789f4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="pulse-gradient-large" x1="84" y1="38" x2="194" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2789f4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>

    <g id="terminal-mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 8H30L53 31L30 54H10" stroke="#2789f4" stroke-width="9"/>
      <path d="M84 8V68M194 8V68" stroke="#2789f4" stroke-width="9"/>
      <path d="M84 38H104L113 19L125 57L137 38H194" stroke="url(#pulse-gradient)" stroke-width="9"/>
      <rect x="214" y="25" width="12" height="28" rx="2" fill="#7dd3fc" stroke="none"/>
      <circle cx="84" cy="38" r="4.5" fill="#7dd3fc" stroke="none"/>
      <circle cx="194" cy="38" r="4.5" fill="#7dd3fc" stroke="none"/>
    </g>
    <g id="terminal-mark-mono" fill="none" stroke="#09182b" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 8H30L53 31L30 54H10" stroke-width="9"/>
      <path d="M84 8V68M194 8V68" stroke-width="9"/>
      <path d="M84 38H104L113 19L125 57L137 38H194" stroke-width="9"/>
      <rect x="214" y="25" width="12" height="28" rx="2" fill="#09182b" stroke="none"/>
    </g>
    <g id="terminal-mark-reverse" fill="none" stroke="#f1f7ff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 8H30L53 31L30 54H10" stroke-width="9"/>
      <path d="M84 8V68M194 8V68" stroke-width="9"/>
      <path d="M84 38H104L113 19L125 57L137 38H194" stroke-width="9"/>
      <rect x="214" y="25" width="12" height="28" rx="2" fill="#f1f7ff" stroke="none"/>
    </g>
  </defs>

  <!-- Presentation board -->
  <rect width="1600" height="900" fill="#071426"/>
  <rect x="42" y="42" width="1516" height="816" rx="30" fill="none" stroke="#1b3a59" stroke-width="2"/>

  <!-- Concept label -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="105" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="4">CONCEPT B / TERMINAL H</text>
    <text x="92" y="136" fill="#6b91b7" font-size="15" letter-spacing="2.2">CURSOR BRACKET · PULSE BRIDGE · DEVELOPER TOOL</text>
  </g>

  <!-- Oversized Terminal H mark, kept faithful to Concept B geometry. -->
  <g transform="translate(150 320) scale(2.12)" aria-label="Oversized Terminal H mark">
    <use href="#terminal-mark"/>
  </g>
  <path d="M146 452H598" stroke="#143354" stroke-width="2"/>
  <text x="150" y="492" fill="#3f6d95" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2.7">VECTOR EXPLORATION · COMMAND / SIGNAL / CONTROL</text>

  <!-- Right-side lockup -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(790 202) scale(.72)" aria-label="Heartbeat icon">
      <use href="#terminal-mark"/>
    </g>
    <text x="980" y="242" fill="#f1f7ff" font-size="58" font-weight="700" letter-spacing="-1.7">Heart<tspan fill="#7dd3fc">beat</tspan></text>
    <path d="M982 281H1494" stroke="#2a5277" stroke-width="2"/>
    <text x="982" y="316" fill="#6b91b7" font-size="14" letter-spacing="2.5">CONNECT · OBSERVE · KEEP MOVING</text>
    <text x="982" y="348" fill="#8fb6da" font-size="15" letter-spacing="1.6">LOCAL DEV SERVICE CONTROL</text>
  </g>

  <!-- Usage checks -->
  <path d="M790 430H1494" stroke="#1c3d5e" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="790" y="476" fill="#6b91b7" font-size="15" font-weight="700" letter-spacing="3">SIZE CHECKS</text>
    <g transform="translate(806 514) scale(.26)" aria-label="16 pixel mark"><use href="#terminal-mark"/></g>
    <g transform="translate(975 509) scale(.33)" aria-label="24 pixel mark"><use href="#terminal-mark"/></g>
    <g transform="translate(1157 503) scale(.42)" aria-label="32 pixel mark"><use href="#terminal-mark"/></g>
    <text x="818" y="625" fill="#8aa7c0" font-size="13" letter-spacing="1.2">16 px</text>
    <text x="987" y="625" fill="#8aa7c0" font-size="13" letter-spacing="1.2">24 px</text>
    <text x="1176" y="625" fill="#8aa7c0" font-size="13" letter-spacing="1.2">32 px</text>

    <text x="1320" y="510" fill="#6b91b7" font-size="15" font-weight="700" letter-spacing="3">MONO / REVERSE</text>
    <rect x="1320" y="538" width="108" height="108" rx="18" fill="#f1f7ff"/>
    <g transform="translate(1331 577) scale(.44)" aria-label="Mono mark"><use href="#terminal-mark-mono"/></g>
    <rect x="1444" y="538" width="108" height="108" rx="18" fill="#142d48" stroke="#21496d" stroke-width="2"/>
    <g transform="translate(1455 577) scale(.44)" aria-label="Reverse mark"><use href="#terminal-mark-reverse"/></g>
  </g>

  <text x="1494" y="810" text-anchor="end" fill="#3f6d95" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.1">HEARTBEAT / BRAND STUDY / 2026</text>
</svg>
