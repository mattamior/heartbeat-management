<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Heartbeat Concept D — Service Stack</title>
  <desc id="desc">A restrained brand presentation board showing three offset rounded service modules that form a unified stack.</desc>
  <rect width="1600" height="900" fill="#0b1220"/>
  <rect x="26" y="26" width="1548" height="848" rx="8" fill="none" stroke="#24344b" stroke-width="2"/>

  <!-- board labels -->
  <text x="76" y="86" fill="#8fa4bf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="3.2">CONCEPT D / SERVICE STACK</text>
  <text x="76" y="116" fill="#50647e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.2">ORCHESTRATE · RUN · REPEAT</text>

  <!-- left hero mark -->
  <g transform="translate(116 214)">
    <!-- subtle alignment guide -->
    <path d="M28 484H708" stroke="#1b2a40" stroke-width="1"/>
    <!-- back module -->
    <rect x="86" y="252" width="500" height="152" rx="28" fill="#19314f" stroke="#3d6388" stroke-width="3"/>
    <path d="M116 328h62" stroke="#79b6cf" stroke-width="5" stroke-linecap="round"/>
    <circle cx="514" cy="328" r="8" fill="#79b6cf"/>
    <!-- middle module -->
    <rect x="48" y="142" width="500" height="152" rx="28" fill="#25486d" stroke="#5d88ac" stroke-width="3"/>
    <path d="M78 218h62" stroke="#b6d4e3" stroke-width="5" stroke-linecap="round"/>
    <circle cx="476" cy="218" r="8" fill="#b6d4e3"/>
    <!-- front module -->
    <rect x="10" y="32" width="500" height="152" rx="28" fill="#2789f4" stroke="#8bc7ff" stroke-width="3"/>
    <path d="M40 108h62" stroke="#e5f3ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="438" cy="108" r="8" fill="#e5f3ff"/>
    <!-- restrained connector cuts; intentionally not a continuous graph -->
    <path d="M480 184v26" stroke="#8bc7ff" stroke-width="3"/>
    <path d="M518 294v26" stroke="#5d88ac" stroke-width="3"/>
    <path d="M556 404v26" stroke="#3d6388" stroke-width="3"/>
  </g>

  <!-- wordmark and descriptor -->
  <g transform="translate(900 212)">
    <text x="0" y="64" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="650" letter-spacing="-2.4">Heartbeat</text>
    <rect x="2" y="93" width="64" height="4" rx="2" fill="#2789f4"/>
    <text x="0" y="142" fill="#b8c8d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="1.2">本地开发服务控制台</text>
    <text x="0" y="174" fill="#6f849e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.4">LOCAL DEV SERVICE CONTROL</text>
    <text x="0" y="238" fill="#50647e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.8">A STACKED SYSTEM FOR MANY SMALL RUNS</text>
  </g>

  <!-- size checks -->
  <g transform="translate(900 554)">
    <text x="0" y="0" fill="#8fa4bf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2.4">SIZE CHECK</text>
    <g transform="translate(0 28)">
      <g transform="translate(0 0)">
        <rect width="102" height="56" rx="12" fill="#132238" stroke="#2d435f"/>
        <g transform="translate(9 11) scale(.055)"><rect x="86" y="252" width="500" height="152" rx="28" fill="#19314f"/><rect x="48" y="142" width="500" height="152" rx="28" fill="#25486d"/><rect x="10" y="32" width="500" height="152" rx="28" fill="#2789f4"/></g>
        <text x="68" y="25" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">16</text><text x="68" y="44" fill="#6f849e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">px</text>
      </g>
      <g transform="translate(130 0)">
        <rect width="102" height="56" rx="12" fill="#132238" stroke="#2d435f"/>
        <g transform="translate(9 12) scale(.07)"><rect x="86" y="252" width="500" height="152" rx="28" fill="#19314f"/><rect x="48" y="142" width="500" height="152" rx="28" fill="#25486d"/><rect x="10" y="32" width="500" height="152" rx="28" fill="#2789f4"/></g>
        <text x="68" y="25" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">24</text><text x="68" y="44" fill="#6f849e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">px</text>
      </g>
      <g transform="translate(260 0)">
        <rect width="102" height="56" rx="12" fill="#132238" stroke="#2d435f"/>
        <g transform="translate(9 8) scale(.10)"><rect x="86" y="252" width="500" height="152" rx="28" fill="#19314f"/><rect x="48" y="142" width="500" height="152" rx="28" fill="#25486d"/><rect x="10" y="32" width="500" height="152" rx="28" fill="#2789f4"/></g>
        <text x="68" y="25" fill="#f2f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">32</text><text x="68" y="44" fill="#6f849e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">px</text>
      </g>
    </g>

    <!-- mono/reverse -->
    <text x="0" y="142" fill="#8fa4bf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2.4">MONO / REVERSE</text>
    <g transform="translate(0 166)">
      <rect width="190" height="88" rx="14" fill="#f4f7fa"/>
      <g transform="translate(25 20) scale(.18)"><rect x="86" y="252" width="500" height="152" rx="28" fill="#1a2430"/><rect x="48" y="142" width="500" height="152" rx="28" fill="#1a2430"/><rect x="10" y="32" width="500" height="152" rx="28" fill="#1a2430"/></g>
      <text x="122" y="48" fill="#1a2430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.4">MONO</text>
      <rect x="208" width="190" height="88" rx="14" fill="#16283f" stroke="#304b69"/>
      <g transform="translate(233 20) scale(.18)"><rect x="86" y="252" width="500" height="152" rx="28" fill="#e5f3ff"/><rect x="48" y="142" width="500" height="152" rx="28" fill="#e5f3ff"/><rect x="10" y="32" width="500" height="152" rx="28" fill="#e5f3ff"/></g>
      <text x="330" y="48" fill="#e5f3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.4">REVERSE</text>
    </g>
  </g>

  <text x="76" y="828" fill="#50647e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.6">THREE LAYERS · ONE CONTROL SURFACE</text>
  <text x="1524" y="828" text-anchor="end" fill="#50647e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.6">HB / D-01</text>
</svg>
